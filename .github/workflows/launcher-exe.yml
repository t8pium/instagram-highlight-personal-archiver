name: Build launcher EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install builder
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build launcher
        run: python -m PyInstaller --onefile --windowed --name InstagramToolkitLauncher desktop_launcher.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramToolkitLauncher-Windows
          path: dist/InstagramToolkitLauncher.exe
